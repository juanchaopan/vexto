<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>vexto phone prototype</title>
    <style>
      /* Visual tokens, type scale and components come from lingocurrent's approved touch layout. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f4f6f9, #151b25);
        --surface: light-dark(#fff, #1d2634);
        --ink: light-dark(#26344b, #e2e9f4);
        --muted: light-dark(#637187, #a9b7cb);
        --line: light-dark(#d8dfe9, #3b475b);
        --blue: light-dark(#245ab8, #9bbdff);
        --on: light-dark(#fff, #15284a);
        --soft: light-dark(#edf3fe, #263a58);
        --red: light-dark(#ba3c40, #ff9b9e);
        --amber: light-dark(#89590b, #f8cb75);
        --green: light-dark(#24745a, #83d5b7);
      }
      /* Screenshot states turn every animation and transition off. */
      html[data-static] *,
      html[data-static] *::before,
      html[data-static] *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          'Microsoft YaHei',
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      /* The container query below needs this container; without it the narrow rules never apply. */
      .app {
        container: app / inline-size;
        position: relative;
        max-width: 600px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 4px 10px;
        background: linear-gradient(var(--surface), var(--bg));
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow:
          0 1px 1px #00000008,
          inset 0 1px #ffffff15;
        font-weight: 500;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        box-shadow: inset 0 1px 3px #00000025;
      }
      button:disabled {
        opacity: 0.45;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      button.primary {
        background: linear-gradient(color-mix(in srgb, var(--blue), #fff 6%), var(--blue));
        border-color: var(--blue);
        color: var(--on);
      }
      button.flat {
        border-color: transparent;
        box-shadow: none;
        background: transparent;
      }
      button.icon {
        width: 44px;
        padding: 4px;
        flex: none;
      }
      button.danger {
        background: var(--red);
        border-color: var(--red);
        color: light-dark(#fff, #311216);
      }
      .ico {
        width: 14px;
        height: 14px;
        flex: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
      }
      a {
        color: var(--blue);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }
      input:not([type='range']):not([type='checkbox']):not([type='radio']),
      select {
        min-width: 0;
        min-height: 44px;
        padding: 5px 7px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 16px;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Top bar: brand, the two entries and the account button. */
      .rail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        padding: 16px 12px 9px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      .brand b {
        display: grid;
        place-items: center;
        width: 23px;
        height: 25px;
        border-radius: 5px;
        background: var(--blue);
        color: var(--on);
        font-size: 15px;
      }
      .rail nav {
        display: flex;
        flex: 1;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .rail nav button {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        box-shadow: 0 1px 1px #00000008;
      }
      .rail nav button[aria-current='page'] {
        border-color: color-mix(in srgb, var(--blue), var(--line) 50%);
        background: var(--soft);
        color: var(--blue);
      }
      .vocabulary-nav {
        position: relative;
        display: block;
      }
      .badges {
        position: absolute;
        right: -11px;
        top: -10px;
        display: flex;
        gap: 3px;
        pointer-events: none;
      }
      .badge {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border: 2px solid var(--bg);
        border-radius: 50%;
        background: var(--red);
        color: light-dark(#fff, #311216);
        font-size: 10px;
        font-weight: 600;
      }
      .badge.new {
        background: light-dark(#f2c94c, #e9bb3f);
        color: #483600;
      }
      .vocabulary-nav .badges {
        right: -5px;
        top: -8px;
        gap: 2px;
      }
      .vocabulary-nav .badge {
        width: auto;
        min-width: 18px;
        height: 18px;
        padding: 0 3px;
        border-color: var(--surface);
        border-radius: 9px;
      }
      .rail .avatar {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--bg);
        font-size: 12px;
      }
      @container app (max-width: 450px) {
        .nav-text,
        .rail .brand span,
        .mode-text,
        .control-text {
          display: none;
        }
        .rail nav button {
          width: 44px;
          min-width: 44px;
          justify-content: center;
        }
        .float .lemma-row h2 {
          font-size: 18px;
        }
      }

      /* Lists. */
      .main {
        padding: 15px 12px;
      }
      .main.is-reader {
        padding-bottom: 0;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 15px;
      }
      .page-head h1 {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin: 11px 0;
      }
      .search {
        display: flex;
        flex: 1 1 100%;
        gap: 5px;
      }
      .search input {
        width: 100%;
      }
      .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .touch-controls {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
      }
      .column-filter {
        display: inline-flex;
        position: relative;
        flex: none;
      }
      .filter-trigger {
        gap: 6px;
        min-height: 44px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        box-shadow: none;
        color: var(--muted);
      }
      .filter-trigger .ico {
        width: 15px;
        height: 15px;
      }
      .filter-trigger .ico.funnel {
        width: 11px;
        height: 11px;
      }
      .filter-trigger.is-filtered {
        color: var(--blue);
        background: var(--soft);
        border-color: var(--blue);
      }
      .sort-trigger {
        margin-left: auto;
        width: 44px;
        padding: 6px;
        flex: none;
      }
      .control-text {
        font-size: 12px;
        white-space: nowrap;
      }
      .grid-frame {
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      .item-card {
        padding: 13px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .item-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 9px;
      }
      .item-head > div {
        min-width: 0;
      }
      .article-link {
        display: block;
        max-width: 100%;
        min-height: 28px;
        padding: 0;
        overflow: hidden;
        border: 0;
        background: none;
        box-shadow: none;
        color: var(--blue);
        font-size: 14px;
        line-height: 1.5;
        text-align: left;
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .excerpt {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }
      .source {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        min-width: 0;
      }
      .source-mark {
        display: inline-grid;
        place-items: center;
        flex: none;
        min-width: 18px;
        height: 18px;
        padding: 0 3px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--mark) 13%, var(--surface));
        color: var(--mark);
        font-size: 10px;
        font-weight: 700;
        line-height: 18px;
        letter-spacing: 0.2px;
      }
      .item-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .visit-meta {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .visit-meta span {
        white-space: nowrap;
      }
      .load-more {
        display: flex;
        justify-content: center;
        padding: 14px;
      }
      .empty {
        padding: 25px 14px;
        color: var(--muted);
      }

      /* Vocabulary. */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 13px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        min-width: 44px;
        padding: 6px 1px 9px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        font-size: 12px;
      }
      .tabs button[aria-pressed='true'] {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }
      .mode-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 15px;
        margin: 15px 0 17px;
        padding: 6px 4px 0;
      }
      .mode-wrap {
        position: relative;
        display: inline-flex;
        flex: 1;
        min-width: 0;
      }
      .mode-wrap > button {
        width: 100%;
        min-width: 0;
        padding: 6px;
      }
      .mode-wrap .badges {
        right: -8px;
      }
      .soon-text {
        font-size: 12px;
        font-weight: 400;
      }
      .mobile-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 5px;
        margin-top: 10px;
      }
      .mode-progress {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        padding: 5px 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        font-size: 12px;
        white-space: nowrap;
      }
      .mode-progress > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress-mode {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none !important;
        color: var(--muted);
      }
      .mode-progress .progress-text {
        flex: none;
        padding-left: 9px;
        border-left: 1px solid var(--line);
      }
      .progress-text {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .progress-text.now {
        color: var(--red);
      }
      .progress-text.new {
        color: var(--blue);
      }
      .progress-text.complete {
        color: var(--green);
      }
      .vocab-card {
        position: relative;
        padding: 0;
        overflow: hidden;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
      }
      .vocab-card .card-front {
        position: relative;
        z-index: 1;
        padding: 12px;
        background: var(--surface);
        transition: transform 0.16s ease;
      }
      .vocab-card.is-selected .card-front {
        background: var(--soft);
      }
      .vocab-card.swipe-open .card-front {
        transform: translateX(-80px);
      }
      .word-card-heading {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .word-card-name {
        flex: 1;
        min-width: 0;
      }
      .word-description {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .vocab-card button.swipe-delete {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
        gap: 4px;
        width: 80px;
        min-height: 100%;
        border: 0;
        border-radius: 0;
        background: var(--red);
        color: light-dark(#fff, #311216);
        box-shadow: none;
      }
      .selection-bar {
        display: flex;
        align-items: center;
        gap: 3px;
        min-height: 48px;
        margin-bottom: 9px;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--soft);
        font-size: 12px;
      }
      .select-visible-label {
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }
      .selection-count {
        margin-left: auto;
        font-size: 11px;
        white-space: nowrap;
      }
      .selection-check {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 44px;
        min-height: 44px;
      }
      .selection-check input {
        width: 17px;
        height: 17px;
        margin: 0;
        accent-color: var(--blue);
      }
      .delete-icon {
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        .vocab-card .card-front {
          transition: none;
        }
      }

      /* Reader and word card. */
      .reader {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
      }
      .reader.card {
        border-bottom: 1px solid var(--line);
        border-radius: 5px;
      }
      .reader-head {
        padding: 15px 12px;
        border-bottom: 1px solid var(--line);
      }
      .reader-head h1 {
        margin: 9px 0;
        font-size: 21px;
        line-height: 1.3;
      }
      .reader-tools {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
      }
      .voice-label {
        display: inline-flex;
        align-items: center;
        flex: none;
        min-height: 44px;
        padding: 0 2px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--muted), transparent 50%);
        text-underline-offset: 2px;
      }
      .reader-tools .voice-label,
      .lemma-row .voice-label {
        margin-left: auto;
      }
      .text-area {
        padding: 9px 8px;
        user-select: text;
        -webkit-user-select: text;
      }
      .sentence {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        align-items: start;
        gap: 3px;
        margin: 4px 0;
        padding: 2px 1px;
        border-radius: 3px;
      }
      .sentence.active {
        background: var(--soft);
        box-shadow: inset 2px 0 var(--blue);
      }
      .sentence.paragraph-start {
        margin-top: 17px;
      }
      .sentence > button {
        width: 44px;
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
        color: var(--muted);
      }
      .sentence.active > button {
        color: var(--blue);
      }
      .sentence p {
        padding: 6px 0;
        font-size: 16px;
        line-height: 1.8;
      }
      [data-word] {
        user-select: text;
        -webkit-user-select: text;
      }
      .attribution {
        display: grid;
        gap: 2px;
        padding: 12px 12px 6px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .attribution .source {
        color: var(--ink);
        font-size: 13px;
      }
      .attribution-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .original-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
      }
      .attribution time {
        font-size: 11px;
        white-space: nowrap;
      }
      .player {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 58px;
        padding: 8px 5px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      .player-track {
        flex: 1;
        min-width: 0;
      }
      .player-track > span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .player input[type='range'] {
        width: 100%;
        height: 28px;
        margin: 0;
        accent-color: var(--blue);
      }
      .speed-button {
        min-width: 44px;
        padding: 4px 6px;
        font-size: 12px;
      }
      .continue-button {
        flex: 1;
      }
      .detail-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 44px;
        margin-bottom: 6px;
      }

      /* Explanation popovers stack above the player (or above the page bottom without one). */
      .float-host {
        position: fixed;
        z-index: 20;
        right: max(10px, calc((100vw - 600px) / 2 + 10px));
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: calc(min(100vw, 600px) - 28px);
        pointer-events: none;
      }
      .float-host.above-player {
        bottom: calc(74px + env(safe-area-inset-bottom));
      }
      .float {
        position: relative;
        overflow-wrap: anywhere;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 10px 35px #00000022;
        font-size: 12px;
        pointer-events: auto;
      }
      .float.back-layer {
        position: absolute;
        left: -8px;
        right: 8px;
        bottom: 0;
        pointer-events: none;
      }
      .float-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 0 0 9px;
        border-bottom: 1px solid var(--line);
        border-radius: 7px 7px 0 0;
        background: var(--bg);
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .float-head > span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .float-head .is-saved {
        color: var(--blue);
      }
      .float-body {
        padding: 11px;
      }
      .lemma-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .lemma-row h2 {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 20px;
        line-height: 1.3;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow-wrap: normal;
      }
      .pos {
        margin-top: 3px !important;
        color: var(--muted);
        font-size: 11px;
      }
      .meaning {
        margin: 11px 0 !important;
        font-size: 14px;
      }
      mark {
        padding: 1px 0;
        background: var(--soft);
        color: var(--blue);
      }
      .inline-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .inline-status.error {
        color: var(--red);
      }
      .inline-status button {
        margin-left: auto;
        color: var(--ink);
      }
      .skeleton {
        height: 12px;
        margin: 10px 0;
        border-radius: 3px;
        background: var(--line);
        opacity: 0.7;
      }
      .example-carousel {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        gap: 0 5px;
        min-width: 0;
        margin: 10px 0 14px;
        touch-action: pan-y pinch-zoom;
      }
      .example-actions {
        display: flex;
        grid-column: 1 / -1;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin: 0 0 3px;
      }
      .example-lead {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .example-controls {
        display: flex;
        gap: 12px;
      }
      .example-text {
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
        margin: 0 !important;
        padding: 4px 0;
        font-size: 15px;
        line-height: 1.8;
        overflow-wrap: normal;
        user-select: text;
        -webkit-user-select: text;
      }
      .example-arrow {
        grid-row: 3;
        align-self: center;
        width: 44px;
      }
      .example-prev {
        grid-column: 1;
      }
      .example-next {
        grid-column: 3;
      }
      .example-count {
        grid-column: 2;
        grid-row: 3;
        align-self: center;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
      }

      /* Single-question review. */
      .review {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 100px);
        padding: 0 3px;
      }
      .review-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .prompt {
        flex: 1;
        padding: 8px 3px 0;
      }
      .target {
        font-size: 20px;
        font-weight: 500;
        line-height: 1.4;
      }
      .target[lang='en'] {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cloze {
        font-size: 14px !important;
        line-height: 1.7 !important;
      }
      .gap {
        display: inline-block;
        width: 76px;
        height: 20px;
        border-bottom: 2px solid var(--muted);
        border-radius: 2px;
        background: var(--bg);
        vertical-align: baseline;
        user-select: none;
      }
      .answer-label {
        display: grid;
        gap: 4px;
      }
      .answer {
        width: 100%;
        margin-top: 2px;
      }
      .option-list {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      .option-list button {
        justify-content: start;
        padding: 7px 10px;
        background: var(--surface);
        font-size: 13px;
        font-weight: 400;
        text-align: left;
      }
      .option-list button[aria-pressed='true'] {
        border-color: var(--blue);
        background: var(--soft);
      }
      .option-list small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .feedback {
        margin-top: 13px;
        padding: 9px 11px;
        border-radius: 4px;
        background: var(--soft);
        font-size: 12px;
      }
      .feedback.error {
        background: color-mix(in srgb, var(--red) 10%, var(--surface));
        color: var(--red);
      }
      .feedback.warn {
        background: color-mix(in srgb, var(--amber) 12%, var(--surface));
        color: var(--amber);
      }
      .submit-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .submit-row button {
        min-width: 90px;
      }
      .review-counter {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .review-empty {
        display: grid;
        flex: 1;
        align-content: center;
        gap: 4px;
        padding: 40px 10px;
        text-align: center;
      }
      .review-empty p:first-child {
        font-size: 15px;
        font-weight: 500;
      }

      /* Popovers, dialogs and status messages. */
      .overlay-host {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }
      .compact-popover {
        position: absolute;
        left: 12px;
        z-index: 30;
        max-width: calc(100% - 24px);
        margin: 0;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 26px #00000024;
        color: var(--ink);
        font-size: 13px;
        font-weight: 400;
        text-align: left;
        white-space: normal;
        pointer-events: auto;
      }
      .popover-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .popover-title strong {
        font-weight: 500;
      }
      .filter-options,
      .sort-options {
        display: grid;
        gap: 0;
        margin: 3px 0 9px;
      }
      .filter-options label,
      .sort-options label {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 44px;
        font-size: 12px;
        white-space: nowrap;
      }
      .compact-popover input[type='checkbox'],
      .compact-popover input[type='radio'] {
        flex: none;
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--blue);
      }
      .filter-popover-actions,
      .sort-direction {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
      }
      .sort-direction button {
        flex: 1;
        padding: 5px;
      }
      .sort-direction button[aria-pressed='true'] {
        color: var(--blue);
        border-color: var(--blue);
        background: var(--soft);
      }
      .account-popover {
        display: grid;
        gap: 6px;
      }
      .account-popover button {
        justify-content: flex-start;
        width: 100%;
      }
      .select-field {
        display: grid;
        gap: 4px;
        min-width: 0;
        margin-bottom: 10px;
        font-size: 11px;
      }
      .select-field select {
        width: 100%;
        max-width: 100%;
      }
      .selection-fields {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
      dialog {
        width: min(380px, calc(100% - 30px));
        padding: 20px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 16px 60px #00000040;
        font-size: 13px;
      }
      dialog::backdrop {
        background: #10223d66;
      }
      dialog p {
        margin: 12px 0;
        line-height: 1.7;
      }
      .dialog-actions {
        display: flex;
        justify-content: end;
        gap: 8px;
        margin-top: 17px;
      }
      .compare {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        margin-top: 12px;
      }
      .compare section {
        min-width: 0;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--bg);
      }
      .compare section.is-new {
        border-color: color-mix(in srgb, var(--blue), var(--line) 50%);
        background: var(--soft);
      }
      .compare h3 {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      .compare .meaning {
        margin: 0 0 8px !important;
        font-size: 13px;
      }
      .compare ol {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 16px;
        font-size: 12px;
        line-height: 1.5;
      }
      .notice {
        position: fixed;
        z-index: 40;
        top: 64px;
        left: 50%;
        max-width: min(340px, calc(100vw - 24px));
        padding: 8px 12px;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 26px #00000024;
        font-size: 12px;
      }
      .notice:empty {
        display: none;
      }

      /* Pages outside the app shell: sign-in, no access, terms and license. */
      .doc-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--surface);
      }
      .doc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 69px;
        padding: 16px 12px 9px;
        border-bottom: 1px solid var(--line);
      }
      .doc-body {
        flex: 1;
        padding: 18px 16px 24px;
        font-size: 14px;
        line-height: 1.6;
      }
      .doc-body h1 {
        margin-bottom: 4px;
        font-size: 22px;
      }
      .doc-body h2 {
        margin: 20px 0 6px;
        font-size: 15px;
      }
      .doc-body p {
        margin: 8px 0;
      }
      .doc-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
      }
      .restrictions {
        display: grid;
        gap: 6px;
        margin: 8px 0;
        padding: 0;
        list-style: none;
      }
      .restrictions li {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
      }
      .doc-actions {
        position: sticky;
        bottom: 0;
        display: flex;
        gap: 10px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      .doc-actions button {
        flex: 1;
      }
      .license-text h2 {
        margin: 18px 0 6px;
        font-size: 14px;
      }
      .license-text p {
        margin: 8px 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .center-page {
        display: grid;
        flex: 1;
        align-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px 16px;
        text-align: center;
      }
      .center-page h1 {
        font-size: 22px;
      }
      .center-page p {
        max-width: 320px;
        color: var(--muted);
      }
      .brand.big {
        font-size: 20px;
      }
      .brand.big b {
        width: 32px;
        height: 34px;
        font-size: 20px;
      }
      .auth-card {
        display: grid;
        gap: 14px;
        width: 100%;
        max-width: 340px;
        padding: 28px 22px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 10px 35px #00000014;
        text-align: center;
      }
      .auth-card h1 {
        font-size: 18px;
      }
      .auth-card .brand {
        justify-content: center;
      }
      .google-button {
        width: 100%;
      }
      .google-mark {
        color: #4285f4;
        font-weight: 700;
        font-size: 15px;
      }
      .auth-foot {
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
      }

            ],
          },
          coating: {
            word: 'coating',
            pos: 'noun',
            zh: '涂层；覆盖层',
            forms: ['coating', 'coatings'],
            examples: [
              'A thin coating of wax protects the wooden table from water.',
              'The coating on the lens reduces glare in bright sunlight.',
            ],
          },
          adapt: {
            word: 'adapt',
            pos: 'verb',
            zh: '使适应；调整',
            forms: ['adapt', 'adapts', 'adapted', 'adapting'],
            examples: [
              'Teams often adapt their plans when the weather changes suddenly.',
              'The cooks had to adapt the recipe for a much smaller oven.',

          dust: {
            word: 'dust',
            pos: 'noun',
            zh: '灰尘；尘土',

          sticky: {

            zh: '黏的；黏性的',
            forms: ['sticky'],
            examples: [
              'The jam left a sticky mark on the kitchen table.',
              'Warm, sticky air made the long walk feel even longer.',
            ],
          },
        };
        const ALT_EXAMPLES = [
          'In this situation, {w} is a useful word to remember.',

        ];

        // ---------------------------------------------------------------- state
        let s;
        let timer = null;
        let noticeTimer = null;
        let observer = null;
        let gesture = null;
        let exampleGesture = null;
        let suppressExampleLookupUntil = 0;
        let afterRender = null;

        function freshState() {

            frozen: false,

            termsAccepted: true,
            page: 'articles',
            back: [],
            articles: baseArticles(),
            words: baseWords(),
            aq: '',
            sourceValues: [],
            categoryValues: [],
            sort: 'collected',
            dir: -1,
            loaded: BATCH,
            loadingMore: false,
            popover: null,
            draft: [],
            accountOpen: false,
            selectionTool: null,
            selectionSegment: 0,
            selectionStart: 0,
            selectionEnd: 0,
            articleId: 1,
            sentence: 0,

            single: null,
            speed: 1,
            queue: [],
            queueIndex: 0,

        }

        // ---------------------------------------------------------------- progress helpers
        const isComplete = (x) => x.round === REVIEW_STAGES.length;
        const isNew = (x) => x.round === 0 && x.mins == null;
        const isDue = (x) => !isComplete(x) && x.mins != null && x.mins <= 0;
        const roundLabel = (x) => (isComplete(x) ? 'Complete' : 'Round ' + (x.round + 1));
        function when(x) {
          if (isComplete(x) || isNew(x)) return '—';
          return x.mins <= 0 ? 'Due' : duration(x.mins);
        }
        function duration(mins) {
          if (mins < 1) return '< 1 min';
          if (mins < 60) {
            const n = Math.ceil(mins);
            return n + (n === 1 ? ' min' : ' mins');
          }
          if (mins < 1440) {
            const n = Math.ceil(mins / 60);
            return n + (n === 1 ? ' hour' : ' hours');
          }
          const n = Math.ceil(mins / 1440);
          return n + (n === 1 ? ' day' : ' days');
        }
        const progressClass = (x) =>
          isComplete(x) ? 'complete' : isNew(x) ? 'new' : isDue(x) ? 'now' : '';
        const wordState = (w) =>
          w.m.every(isNew) ? 'New' : w.m.every(isComplete) ? 'Archived' : 'Ongoing';
        function modeCounts(i) {
          return {
            due: s.words.filter((w) => isDue(w.m[i])).length,
            new: s.words.filter((w) => isNew(w.m[i])).length,
          };
        }
        // Red and yellow counts add up only the modes that can be reviewed now (Speak is excluded).
        function totalCounts() {
          return MODES.reduce(
            (sum, _m, i) => {
              if (!MODE_READY[i]) return sum;
              const c = modeCounts(i);
              return { due: sum.due + c.due, new: sum.new + c.new };
            },
            { due: 0, new: 0 },
          );
        }
        const badges = (c) =>
          (c.due ? `<span class="badge">${c.due}</span>` : '') +
          (c.new ? `<span class="badge new">${c.new}</span>` : '');

        // ---------------------------------------------------------------- text helpers
        const feedOf = (a) => feedByKey[a.feed];
        const activeArticle = () => s.articles.find((a) => a.id === s.articleId) || s.articles[0];
        const sentencesOf = (a) =>
          a.body.flatMap((para, pi) =>
            para.map((text, si) => ({ text, start: pi > 0 && si === 0 })),
          );
        const bodyText = (a) => a.body.flat().join(' ');
        const countWords = (text) =>
          text.match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu)?.length || 0;
        const countText = (n, noun) => `${n} ${noun}${n === 1 ? '' : 's'}`;
        const fmtSpeed = (v) => `${v}×`;
        const sourceMark = (f) =>
          `<span class="source"><span class="source-mark" style="--mark:${f.color}" aria-hidden="true">${esc(f.mark)}</span><span>${esc(f.name)}</span></span>`;

        function wordMarkup(text, targetForms = []) {
          const lower = text.toLowerCase();
          const ranges = [];
          targetForms.forEach((form) => {
            const t = form.toLowerCase();
            let from = 0;
            let hit;
            while (t && (hit = lower.indexOf(t, from)) !== -1) {
              ranges.push([hit, hit + t.length]);
              from = hit + t.length;
            }
          });
          let offset = 0;
          return text
            .split(/(\s+)/)
            .map((part) => {
              const start = offset;
              offset += part.length;
              if (!part || /^\s+$/.test(part)) return part;
              const key = part.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
              const marked = ranges.some(([a, b]) => start < b && offset > a);
              return `<span data-word="${esc(key)}">${marked ? '<mark>' : ''}${esc(part)}${marked ? '</mark>' : ''}</span>`;
            })
            .join('');
        }
        function formPattern(forms) {
          const sorted = [...forms]
            .sort((a, b) => b.length - a.length)
            .map((f) => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
          return new RegExp(`\\b(?:${sorted.join('|')})\\b`, 'gi');
        }
        // The hidden target never reaches the page: each occurrence becomes an empty gap.
        function maskedExample(text, forms) {
          return text
            .split(formPattern(forms))
            .map((piece) => `<span class="selectable">${wordMarkup(piece)}</span>`)
            .join('<span class="gap" role="img" aria-label="Hidden word"></span>');
        }

        // ---------------------------------------------------------------- queries
        function filteredArticles() {
          const q = s.aq.toLowerCase();
          const rows = s.articles.filter(
            (a) =>
              (!s.sourceValues.length || s.sourceValues.includes(a.feed)) &&
              (!s.categoryValues.length || s.categoryValues.includes(feedOf(a).category)) &&
              (!q || q.split(/\s+/).every((term) => bodyText(a).toLowerCase().includes(term))),
          );
          const value = (a) =>
            ({
              collected: stamp(a.collected),
              visited: a.visited ? stamp(a.visited) : null,
              article: a.title,
              source: feedOf(a).name,
              category: feedOf(a).category,
            })[s.sort];
          return rows.sort((a, b) => {
            const av = value(a);
            const bv = value(b);
            if (av == null || bv == null) return av == null ? (bv == null ? a.id - b.id : 1) : -1;
            return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * s.dir || a.id - b.id;
          });
        }
        function filteredWords() {
          const q = s.vq.toLowerCase();
          const rows = s.words.filter(
            (w) =>
              (s.tab === 'All' || wordState(w) === s.tab) &&
              (!q || [w.word, w.zh, w.pos, ...w.examples].join(' ').toLowerCase().includes(q)) &&
              s.roundValues.every(
                (values, i) =>
                  !values.length ||
                  values.includes(isComplete(w.m[i]) ? 'Complete' : String(w.m[i].round + 1)),
              ),
          );
          return rows.sort((a, b) => {
            if (s.vsort === 'word') return a.word.localeCompare(b.word) * s.vdir || a.id - b.id;
            const [, kind, idx] = s.vsort.match(/^(round|next)(\d)$/);
            const pick = (w) => {
              const x = w.m[Number(idx)];
              return kind === 'round' ? (isComplete(x) ? null : x.round + 1) : x.mins;
            };
            const av = pick(a);
            const bv = pick(b);
            if (av == null || bv == null) return av == null ? (bv == null ? a.id - b.id : 1) : -1;
            return (av - bv) * s.vdir || a.id - b.id;
          });
        }

        // ---------------------------------------------------------------- shared pieces
        function rail() {
          const c = totalCounts();
          const onArticles = ['articles', 'reader'].includes(s.page);
          const onVocabulary = ['vocabulary', 'detail', 'review'].includes(s.page);
          return `<header class="rail"><div class="brand" aria-label="vexto"><b aria-hidden="true">v</b><span>vexto</span></div><nav aria-label="Main navigation"><button data-page="articles" aria-label="Articles" ${onArticles ? 'aria-current="page"' : ''}>${icon('newspaper')}<span class="nav-text">Articles</span></button><span class="vocabulary-nav"><button data-page="vocabulary" aria-label="Vocabulary, ${c.due} due reviews, ${c.new} new reviews" ${onVocabulary ? 'aria-current="page"' : ''}>${icon('book-open')}<span class="nav-text">Vocabulary</span></button><span class="badges" aria-hidden="true">${badges(c)}</span></span></nav><button class="avatar flat" data-action="account" aria-label="Account menu" aria-haspopup="dialog" aria-expanded="${s.accountOpen}">${esc(initials)}</button></header>`;
        }
        const searchBox = (field, placeholder) =>
          `<form class="search" data-search="${field}" role="search"><input aria-label="${esc(placeholder)}" value="${esc(s[field])}" placeholder="${esc(placeholder)}" enterkeyhint="search"><button type="submit" class="icon" aria-label="Search">${icon('search')}</button></form>`;
        function loadMore(total, loaded, loading) {

        function filterValues(key) {

        function filterOptions(key) {
          if (key === 'source') return FEEDS.map((f) => [f.key, f.name]);
          if (key === 'category') return CATEGORIES.map((c) => [c, c]);

            v,
            v === 'Complete' ? v : 'Round ' + v,

        }
        const filterLabel = (key) =>
          key === 'source'

        function sortFields() {

        // ---------------------------------------------------------------- pages outside the shell
        function signInPage() {
          return `<div class="doc-page"><div class="center-page"><div class="auth-card"><div class="brand big"><b aria-hidden="true">v</b><span>vexto</span></div><h1>Sign in to vexto</h1><p class="muted">Welcome! Please sign in to continue.</p><button class="google-button" data-action="sign-in"><span class="google-mark" aria-hidden="true">G</span>Continue with Google</button><div class="auth-foot">Secured by Clerk</div></div></div></div>`;

        // The license is shown reflowed for a phone: hard line breaks inside a paragraph become spaces.
        function licenseBlocks() {
          const blocks = [];
          let current = null;

            /^(\([a-z]\)|[a-z]\.\s|\d+\.\s|Section [IVX]+:|Attachment A$|Use Restrictions$|END OF TERMS|NOW THEREFORE|You agree not to use)/;

        }

        // ---------------------------------------------------------------- Articles
        function articleCard(a) {

        // ---------------------------------------------------------------- Reader
        function readerPage() {
          const a = activeArticle();
          const f = feedOf(a);
          const rows = sentencesOf(a);
          const words = countWords(bodyText(a));
          const minutes = Math.max(1, Math.ceil((words * 0.4) / 60));
          const playingArticle = s.playing && s.playMode === 'article';
          const topLabel = playingArticle
            ? 'Pause article'
            : s.single != null
              ? `Play from sentence ${s.single + 1}`
              : s.position
                ? 'Resume article'
                : 'Play article';
          const back =
            s.readerClose === 'x'
              ? `<div class="detail-controls"><button class="icon flat" data-action="close-article" aria-label="Close article and return to Articles">${icon('x')}</button></div>`
              : `<div class="page-head"><button class="flat" data-action="close-article">${icon('arrow-left')}Articles</button></div>`;
          const highlight = s.playing || s.position || s.single != null;
          const sentences = rows
            .map((row, i) => {
              const selected = s.single === i;
              return `<div class="sentence ${highlight && i === s.sentence ? 'active' : ''} ${row.start ? 'paragraph-start' : ''}" data-sentence-row="${i}"><button data-sentence="${i}" aria-label="${selected ? `Stop sentence ${i + 1} and clear the selection` : `Play sentence ${i + 1}`}">${icon(selected ? 'square' : 'play')}</button><p class="selectable">${wordMarkup(row.text)}</p></div>`;
            })
            .join('');
          const credit =
            esc(f.credit) +
            (a.author ? ` By ${esc(a.author)}.` : '') +
            (f.license ? ` <a href="${esc(f.license.url)}">${esc(f.license.name)}</a>` : '');
          const attribution = `<footer class="attribution" aria-label="Source">${sourceMark(f)}<p>${credit}</p><div class="attribution-row"><a class="original-link" href="${esc(f.site)}" target="_blank" rel="noopener noreferrer">Original${icon('external-link')}</a><time aria-label="Collected ${fmtLong(a.collected)}">${fmtLong(a.collected)}</time></div></footer>`;
          return `${back}<article class="reader"><header class="reader-head"><div class="item-meta">${sourceMark(f)}<span>${esc(f.category)}</span></div><h1>${esc(a.title)}</h1><div class="small muted">${words} words · ${minutes} min listening</div><div class="reader-tools"><button class="primary icon" data-action="toggle" aria-label="${topLabel}">${icon(playingArticle ? 'pause' : 'play')}</button>${selectionButton('article')}${voiceLabel()}</div></header><div class="text-area" data-select-scope="article">${sentences}</div>${attribution}${player(a, rows.length)}</article>`;
        }
        function player(a, total) {
          const playingArticle = s.playing && s.playMode === 'article';
          const inQueue = s.queue.length > 0;
          const middle = s.blocked
            ? '<button class="primary continue-button" data-action="continue">Tap to continue</button>'
            : `<button class="primary icon" data-action="toggle" aria-label="${playingArticle ? 'Pause' : 'Play'} article">${icon(playingArticle ? 'pause' : 'play')}</button><div class="player-track"><span>${esc(a.title)} · ${s.sentence + 1}/${total}</span><input type="range" aria-label="Article progress" min="0" max="${total - 1}" value="${s.sentence}" data-seek></div>`;
          return `<footer class="player" aria-label="Article player">${middle}<button class="speed-button" data-action="speed" aria-label="Playback speed, ${fmtSpeed(s.speed)}" aria-haspopup="dialog" aria-expanded="${s.popover === 'speed'}">${fmtSpeed(s.speed)}</button>${inQueue ? `<button class="icon flat" data-action="next-article" aria-label="Next article">${icon('skip-forward')}</button>` : ''}</footer>`;
        }

        // ---------------------------------------------------------------- Explanations
        function exampleRecord(context, layerIndex = 0) {
          if (context === 'lookup') {
            const l = s.layers[layerIndex];
            return { rows: l.examples, index: l.idx, forms: l.forms };
          }
          if (context === 'detail') {
            const w = detailWord();
            return {
              rows: w.examples,
              index: Math.min(s.detailExample, w.examples.length - 1),
              forms: w.forms,
            };
          }
          const w = reviewWord();
          return {
            rows: w.examples,
            index: Math.min(s.review.example, w.examples.length - 1),
            forms: w.forms,
          };
        }
        function examplePanel(context, layerIndex = 0) {
          const { rows, index, forms } = exampleRecord(context, layerIndex);
          const reviewing = context === 'review';
          const hidden = reviewing && s.review.mode !== 'Translate';
          const data = `data-example-context="${context}" data-example-layer="${layerIndex}"`;
          let lead = '<span class="small muted">Example</span>';
          let controls = selectionButton(context === 'lookup' ? 'example' : context);
          if (reviewing && s.review.mode === 'Spell') {
            lead = `<div class="example-lead"><button data-action="play-review-example" aria-label="Play the full example">${icon('volume-2')}Play example</button>${voiceLabel()}</div>`;
          } else if (!reviewing) {
            controls += `<button class="icon" data-action="play-example" ${data} aria-label="Play example">${icon('volume-2')}</button><button class="icon" data-action="refresh-example" ${data} aria-label="Refresh this example">${icon('refresh-cw')}</button>`;
          }
          const text = hidden
            ? maskedExample(rows[index], forms)
            : wordMarkup(rows[index], reviewing ? [] : forms);
          return `<section class="example-carousel" ${data} role="group" aria-label="Examples"><div class="example-actions">${lead}<div class="example-controls">${controls}</div></div><p class="example-text ${hidden ? 'cloze' : 'selectable'}" data-select-scope="${reviewing ? 'review' : 'example'}">${text}</p><button class="icon flat example-arrow example-prev" data-action="example-prev" ${data} aria-label="Previous example" ${index === 0 ? 'disabled' : ''}>${icon('chevron-left')}</button><span class="example-count" role="status" aria-live="polite">${index + 1} / ${rows.length}</span><button class="icon flat example-arrow example-next" data-action="example-next" ${data} aria-label="Next example" ${index === rows.length - 1 ? 'disabled' : ''}>${icon('chevron-right')}</button></section>`;
        }
        // While word audio is being generated the label gives way to a status; it returns afterwards.
        const audioLabel = (audio) =>
          audio === 'generating'
            ? '<span class="voice-label" role="status">Generating…</span>'
            : voiceLabel();
        const audioError = (audio) =>
          audio === 'error'
            ? `<div class="inline-status error" role="alert">${icon('circle-alert')}<span>Audio isn't available right now.</span><button data-action="retry-audio">Retry</button></div>`
            : '';
        function playWordButton(action, audio) {
          return audio === 'generating'
            ? `<button class="icon flat" data-action="${action}" aria-label="Generating word audio" aria-busy="true">${icon('loader-circle', 'spin')}</button>`
            : `<button class="icon flat" data-action="${action}" aria-label="Play word">${icon('volume-2')}</button>`;
        }
        function floatHTML(layer, n, back) {
          const depth = s.layers.length - n - 1;
          const style = back ? ` style="transform:translateX(${-8 * depth}px);z-index:${n}"` : '';
          const ready = layer.kind === 'ready';
          const add = layer.saved
            ? `<button class="icon flat is-saved" data-action="add-word" aria-label="Saved to Vocabulary" aria-pressed="true">${icon('check')}</button>`
            : `<button class="icon flat" data-action="add-word" aria-label="Add word" ${ready ? '' : 'disabled'}>${icon('plus')}</button>`;
          let body;
          if (layer.kind === 'loading') {
            body = `<div class="float-body" aria-busy="true"><div class="lemma-row"><h2>${esc(layer.text)}</h2></div><div class="skeleton" style="width:28%"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:92%"></div><div class="skeleton" style="width:64%"></div><p class="inline-status" role="status">${icon('loader-circle', 'spin')}Explaining…</p></div>`;
          } else if (layer.kind === 'error') {
            body = `<div class="float-body"><div class="lemma-row"><h2>${esc(layer.text)}</h2></div><div class="inline-status error" role="alert">${icon('circle-alert')}<span>Couldn't explain this.</span><button data-action="retry-lookup">${icon('refresh-cw')}Retry</button></div></div>`;
          } else {
            body = `<div class="float-body"><div class="lemma-row"><h2>${esc(layer.word)}</h2>${playWordButton('play-word', layer.audio)}${audioLabel(layer.audio)}</div>${audioError(layer.audio)}<p class="pos">${esc(layer.pos)}</p><p class="meaning">${esc(layer.zh)}</p>${examplePanel('lookup', n)}</div>`;
          }
          return `<section class="float ${back ? 'back-layer' : ''}"${style} aria-label="Explanation of ${esc(layer.word || layer.text)}" ${back ? 'inert' : ''}><header class="float-head"><span>Word explanation</span>${add}<button class="icon flat" data-action="close-lookup" aria-label="Close this explanation">${icon('x')}</button></header>${body}</section>`;
        }
        function floatHost() {
          if (!['reader', 'detail', 'review'].includes(s.page)) return '';
          return `<div class="float-host ${s.page === 'reader' ? 'above-player' : ''}">${s.layers.map((l, n) => floatHTML(l, n, n < s.layers.length - 1)).join('')}</div>`;
        }

        // ---------------------------------------------------------------- Vocabulary
        function modeButtons() {
          return `<div class="mode-buttons">${MODES.map((m, i) => {
            if (!MODE_READY[i])
              return `<div class="mode-wrap"><button data-mode="${m}" disabled aria-label="${m}, coming soon">${icon(MODE_ICONS[i])}<span class="soon-text">Coming soon</span></button></div>`;
            const c = modeCounts(i);
            return `<div class="mode-wrap"><button data-mode="${m}" ${s.selectMode || s.selectedIds.length ? 'disabled' : ''} aria-label="${m}, ${c.due} due, ${c.new} new">${icon(MODE_ICONS[i])}<span class="mode-text">${m}</span></button><span class="badges" aria-hidden="true">${badges(c)}</span></div>`;
          }).join('')}</div>`;
        }
        function progressGroups(w) {
          return `<div class="mobile-progress">${w.m.map((x, i) => `<div class="mode-progress" aria-label="${MODES[i]}, ${roundLabel(x)}, ${esc(when(x))}"><span class="progress-mode">${icon(MODE_ICONS[i])}<span class="mode-text">${MODES[i]}</span></span><span>${roundLabel(x)}</span><span class="progress-text ${progressClass(x)}">${esc(when(x))}</span></div>`).join('')}</div>`;
        }
        const wordCheckbox = (w) =>
          `<label class="selection-check" aria-label="Select ${esc(w.word)}"><input type="checkbox" data-select-word="${w.id}" aria-label="Select ${esc(w.word)}" ${s.selectedIds.includes(w.id) ? 'checked' : ''}></label>`;
        function wordCard(w) {
          const open = s.swipeId === w.id && !s.selectMode;
          const drag = s.swipeDrag && s.swipeDrag.id === w.id ? s.swipeDrag.x : null;
          const front =
            drag != null ? ` style="transform:translateX(${drag}px);transition:none"` : '';
          const swipe = s.selectMode
            ? ''
            : `<button class="swipe-delete" ${open || drag != null ? '' : 'inert aria-hidden="true"'} data-delete-id="${w.id}" aria-label="Delete ${esc(w.word)}">${icon('trash-2')}Delete</button>`;
          return `<article class="item-card vocab-card ${s.selectedIds.includes(w.id) ? 'is-selected' : ''} ${open ? 'swipe-open' : ''}" data-vocab-card="${w.id}">${swipe}<div class="card-front"${front}><div class="word-card-heading">${s.selectMode ? wordCheckbox(w) : ''}<div class="word-card-name"><button class="article-link" data-card="${w.id}" data-target="card">${esc(w.word)}</button><div class="small muted word-description">${esc(w.pos)} · ${esc(w.zh)}</div></div></div>${progressGroups(w)}</div></article>`;
        }
        function selectionBar(rows) {
          if (!s.selectMode && !s.selectedIds.length) return '';
          const all = rows.length && rows.every((w) => s.selectedIds.includes(w.id));
          return `<div class="selection-bar" role="region" aria-label="Selected words"><div class="select-visible-label"><label class="selection-check"><input type="checkbox" data-select-visible aria-label="Select loaded words" ${all ? 'checked' : ''} ${rows.length ? '' : 'disabled'}></label><span>Loaded</span></div><span class="selection-count" role="status">${s.selectedIds.length} selected</span><button class="icon delete-icon" data-action="delete-selected" aria-label="Delete ${s.selectedIds.length} selected words" ${s.selectedIds.length ? '' : 'disabled'}>${icon('trash-2')}</button><button class="icon flat" data-action="clear-selection" aria-label="Cancel selection">${icon('x')}</button></div>`;
        }
        function vocabularyPage() {
          const rows = filteredWords();
          const shown = rows.slice(0, s.vloaded);
          const empty = s.words.length
            ? 'No words match.'
            : 'No words yet. Select a word while reading to look it up.';
          return `<div class="page-head"><h1>Vocabulary</h1><button class="icon" data-action="selection-mode" aria-label="${s.selectMode ? 'Finish selecting' : 'Select words'}" aria-pressed="${s.selectMode}">${icon(s.selectMode ? 'x' : 'list-checks')}</button></div>${modeButtons()}<div class="tabs" role="group" aria-label="Word state">${['All', 'New', 'Ongoing', 'Archived'].map((t) => `<button data-tab="${t}" aria-pressed="${s.tab === t}">${t}</button>`).join('')}</div><div class="toolbar">${searchBox('vq', 'Search words, examples, 中文')}<span class="count">${countText(rows.length, 'word')}</span></div><div class="toolbar touch-controls">${[0, 1, 2].map((i) => filterTrigger('round' + i)).join('')}${sortTrigger()}</div>${selectionBar(shown)}<div class="grid-frame"><div class="cards">${shown.map(wordCard).join('') || `<div class="empty">${empty}</div>`}${rows.length ? loadMore(rows.length, s.vloaded, s.vloadingMore) : ''}</div></div>`;
        }
        const detailWord = () => s.words.find((w) => w.id === s.detailId) || s.words[0];
        function detailPage() {
          const w = detailWord();
          return `<div class="detail-controls"><button class="icon flat" data-action="close-detail" aria-label="Close word and return to Vocabulary">${icon('x')}</button></div><div class="reader card"><div class="reader-head"><div class="lemma-row"><h2>${esc(w.word)}</h2>${playWordButton('detail-word', s.detailAudio)}${audioLabel(s.detailAudio)}</div>${audioError(s.detailAudio)}<p class="pos">${esc(w.pos)}</p><p class="meaning">${esc(w.zh)}</p></div><div style="padding:16px">${examplePanel('detail')}${progressGroups(w)}</div></div>`;
        }

        // ---------------------------------------------------------------- Review
        const modeIndex = (mode) => MODES.indexOf(mode);
        const reviewWord = () => s.words.find((w) => w.id === s.review.cardId);
        // Due cards first (earliest due, then id), then new cards (by id); no sessions or daily caps.
        function nextQuestion(mode) {
          const i = modeIndex(mode);
          const due = s.words
            .filter((w) => isDue(w.m[i]))
            .sort((a, b) => a.m[i].mins - b.m[i].mins || a.id - b.id);
          const fresh = s.words.filter((w) => isNew(w.m[i])).sort((a, b) => a.id - b.id);
          const w = due[0] || fresh[0];
          if (!w) {
            const waits = s.words
              .map((x) => x.m[i])
              .filter((x) => !isComplete(x) && x.mins > 0)
              .map((x) => x.mins);
            return { mode, empty: true, nextDue: waits.length ? Math.min(...waits) : null };
          }
          return {
            mode,
            cardId: w.id,
            nextRound: w.m[i].round + 1,
            example: 0,
            answer: '',
            option: null,
            feedback: null,
            result: null,
          };
        }
        function reviewPage() {
          const r = s.review;
          const top = `<div class="review-controls"><span>${r.mode}</span><button class="icon flat" data-action="close-review" aria-label="Close review and return to Vocabulary">${icon('x')}</button></div>`;
          if (r.empty) {
            return `<section class="review">${top}<div class="review-empty" role="status"><p>No reviews due.</p>${r.nextDue != null ? `<p class="muted">Next review in ${duration(r.nextDue)}.</p>` : ''}</div></section>`;
          }
          const w = reviewWord();
          const locked = r.feedback != null;
          const translate = r.mode === 'Translate';
          const target = translate
            ? `<div class="target" lang="en">${esc(w.word)}</div>`
            : `<div class="target">${esc(w.zh)}</div>`;
          const input = translate
            ? `<div class="option-list">${w.options.map((o, i) => `<button data-option="${i}" aria-pressed="${r.option === i}" ${locked ? 'disabled' : ''}><span>${esc(o)}<small>${esc(w.pos)}</small></span></button>`).join('')}</div>`
            : `<label class="small muted answer-label">Your answer<input class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-answer ${locked ? 'disabled' : ''} value="${esc(r.answer)}"></label>`;
          const feedback = {
            correct: ['', r.result],
            incorrect: [
              '',
              `${esc(translate ? w.options[w.correct] : w.word)} · Try again in 10 mins`,
            ],
            offline: ['error', 'Not saved. Reconnect to check the result.'],
            changed: ['warn', 'This word changed on another device.'],
          }[r.feedback];
          const button =
            r.feedback === 'offline'
              ? `<button class="primary" data-action="retry-submit">${icon('refresh-cw')}Retry</button>`
              : `<button class="primary" data-action="${locked ? 'next-question' : 'submit-answer'}">${locked ? 'Next' : 'Submit'}${icon('arrow-right')}</button>`;
          return `<section class="review">${top}<div class="prompt">${target}<p class="pos">${esc(w.pos)}</p>${examplePanel('review')}${input}${feedback ? `<div class="feedback ${feedback[0]}" role="status">${feedback[1]}</div>` : ''}</div><div class="submit-row"><span class="review-counter">Round ${r.nextRound}</span>${button}</div></section>`;
        }

        // ---------------------------------------------------------------- overlays and dialogs
        function overlay() {
          if (s.accountOpen) {
            return `<section class="compact-popover account-popover" role="dialog" aria-label="Account" data-width="220"><button data-action="open-terms">${icon('file-text')}Terms</button><button data-action="open-license">${icon('scale')}License</button><button data-action="sign-out">${icon('log-out')}Log out</button></section>`;
          }
          if (s.selectionTool) return selectionPopover();
          if (s.popover === 'speed') {
            return `<section class="compact-popover speed-popover" role="dialog" aria-label="Playback speed" data-width="200"><div class="popover-title"><strong>Speed</strong><button class="icon flat" data-action="cancel-column" aria-label="Close speed">${icon('x')}</button></div><div class="sort-options">${SPEEDS.map((v) => `<label><input type="radio" name="speed" data-speed-choice="${v}" ${s.speed === v ? 'checked' : ''}><span>${fmtSpeed(v)}</span></label>`).join('')}</div></section>`;
          }
          if (s.popover === 'sort') {
            const [key, dir] = currentSort();
            return `<section class="compact-popover sort-popover" role="dialog" aria-label="Sort"><div class="popover-title"><strong>Sort</strong><button class="icon flat" data-action="cancel-column" aria-label="Close sort">${icon('x')}</button></div><div class="sort-options">${sortFields()
              .map(
                ([k, label]) =>
                  `<label><input type="radio" name="sort" data-sort-choice="${k}" ${key === k ? 'checked' : ''}><span>${label}</span></label>`,
              )
              .join(
                '',
              )}</div><div class="sort-direction"><button data-order="1" aria-pressed="${dir === 1}">${icon('arrow-up')}Ascending</button><button data-order="-1" aria-pressed="${dir === -1}">${icon('arrow-down')}Descending</button></div></section>`;
          }
          if (!s.popover) return '';
          const key = s.popover;
          const marks = key === 'source';
          return `<section class="compact-popover filter-popover" role="dialog" aria-label="Filter ${filterLabel(key)}"><div class="popover-title"><strong>${filterLabel(key)}</strong><button class="icon flat" data-action="cancel-column" aria-label="Close filter">${icon('x')}</button></div><div class="filter-options">${filterOptions(
            key,
          )
            .map(
              ([v, label]) =>
                `<label><input type="checkbox" data-filter-choice="${esc(v)}" ${s.draft.includes(v) ? 'checked' : ''}>${marks ? sourceMark(feedByKey[v]) : `<span>${esc(label)}</span>`}</label>`,
            )
            .join(
              '',
            )}</div><div class="filter-popover-actions"><button data-action="clear-column">Clear</button><button class="primary" data-action="apply-column">Apply</button></div></section>`;
        }
        function selectionSegments() {
          if (s.selectionTool === 'article') return sentencesOf(activeArticle()).map((r) => r.text);
          if (s.selectionTool === 'example') {
            const n = s.layers.length - 1;
            const { rows, index } = exampleRecord('lookup', n);
            return [rows[index]];
          }
          if (s.selectionTool === 'detail') {
            const { rows, index } = exampleRecord('detail');
            return [rows[index]];
          }
          const { rows, index, forms } = exampleRecord('review');
          return s.review.mode === 'Translate'
            ? [rows[index]]
            : rows[index].split(formPattern(forms)).filter((t) => t.trim());
        }
        function selectionPopover() {
          const segments = selectionSegments();
          const tokens = (segments[s.selectionSegment] || '').split(/\s+/).filter(Boolean);
          const options = (selected, disabledBelow) =>
            tokens
              .map(
                (t, i) =>
                  `<option value="${i}" ${selected === i ? 'selected' : ''} ${i < disabledBelow ? 'disabled' : ''}>${esc(t)}</option>`,
              )
              .join('');
          return `<section class="compact-popover selection-popover" role="dialog" aria-label="Select words"><div class="popover-title"><strong>Select words</strong><button class="icon flat" data-action="close-selection" aria-label="Close selection">${icon('x')}</button></div>${segments.length > 1 ? `<label class="select-field">Sentence<select data-selection-segment>${segments.map((t, i) => `<option value="${i}" ${s.selectionSegment === i ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` : ''}<div class="selection-fields"><label class="select-field">From<select data-selection-start>${options(s.selectionStart, 0)}</select></label><label class="select-field">To<select data-selection-end>${options(s.selectionEnd, s.selectionStart)}</select></label></div><button class="primary" data-action="lookup-chosen">Look up</button></section>`;
        }
        function dialogHTML() {
          const d = s.dialog;
          if (!d) return '';
          if (d.kind === 'delete') {
            const entries = filteredWords().filter((w) => d.ids.includes(w.id));
            const names =
              entries
                .slice(0, 3)
                .map((w) => w.word)
                .join(', ') + (entries.length > 3 ? ` +${entries.length - 3}` : '');
            return `<dialog aria-labelledby="dialog-title"><h2 id="dialog-title">${entries.length === 1 ? 'Delete word?' : `Delete ${entries.length} words?`}</h2><p>${esc(names)}. Review progress will also be deleted.</p><div class="dialog-actions"><button data-action="cancel-dialog">Cancel</button><button class="danger" data-action="confirm-dialog">Delete</button></div></dialog>`;
          }
          const layer = s.layers[d.layer];
          const saved = savedCardFor(layer);
          const column = (title, cls, meaning, examples) =>
            `<section class="${cls}"><h3>${title}</h3><p class="meaning">${esc(meaning)}</p><ol>${examples.map((e) => `<li>${esc(e)}</li>`).join('')}</ol></section>`;
          return `<dialog aria-labelledby="dialog-title"><h2 id="dialog-title">Replace saved word?</h2><p class="muted" style="margin:6px 0 0">${esc(saved.word)} · ${esc(saved.pos)}</p><div class="compare">${column('Saved', '', saved.zh, saved.examples)}${column('New', 'is-new', layer.zh, layer.examples)}</div><p>Review progress stays the same.</p><div class="dialog-actions"><button data-action="cancel-dialog">Cancel</button><button class="primary" data-action="confirm-dialog">Replace</button></div></dialog>`;
        }
        const savedCardFor = (layer) =>
          s.words.find(
            (w) => w.word.toLowerCase() === (layer.word || '').toLowerCase() && w.pos === layer.pos,
          );

        function positionOverlay() {
          const panel = app.querySelector('.compact-popover');
          if (!panel) return;
          const selector = s.accountOpen
            ? '[data-action="account"]'
            : s.selectionTool
              ? `[data-selection-context="${s.selectionTool}"]`
              : s.popover === 'sort'
                ? '[data-action="sort-options"]'
                : s.popover === 'speed'
                  ? '[data-action="speed"]'
                  : `[data-column-filter="${s.popover}"]`;
          const trigger = [...app.querySelectorAll(selector)].find(
            (el) => el.getBoundingClientRect().width > 0,
          );
          if (!trigger) return;
          const cr = app.getBoundingClientRect();
          const tr = trigger.getBoundingClientRect();
          const margin = 12;
          const width = Math.max(
            0,
            Math.min(Number(panel.dataset.width || 280), cr.width - 2 * margin),
          );
          panel.style.width = width + 'px';
          panel.style.maxHeight = Math.max(100, window.innerHeight - 24) + 'px';
          panel.style.overflowY = 'auto';
          const height = panel.getBoundingClientRect().height;
          const left = Math.max(
            margin,
            Math.min(tr.right - cr.left - width, cr.width - width - margin),
          );
          let top = tr.bottom - cr.top + 6;
          const visibleBottom = Math.min(cr.bottom, window.innerHeight) - cr.top - margin;
          if (top + height > visibleBottom && tr.top - cr.top - height - 6 >= margin)
            top = tr.top - cr.top - height - 6;
          panel.style.left = left + 'px';
          panel.style.top = top + 'px';
        }

        // ---------------------------------------------------------------- render
        function pageBody() {
          if (s.page === 'reader') return readerPage();
          if (s.page === 'vocabulary') return vocabularyPage();
          if (s.page === 'detail') return detailPage();
          if (s.page === 'review') return reviewPage();
          return articlesPage();
        }
        // The license page is public; everything else needs a member who accepted the current terms.
        function render() {
          observer?.disconnect();
          let html;
          if (s.page === 'license') html = licensePage();
          else if (s.auth === 'signedout') html = signInPage();
          else if (s.auth === 'notmember') html = noAccessPage();
          else if (!s.termsAccepted) html = termsPage(false);
          else if (s.page === 'terms') html = termsPage(true);
          else
            html = `${rail()}<main class="main ${s.page === 'reader' ? 'is-reader' : ''}">${pageBody()}</main>${floatHost()}`;
          app.innerHTML = `${html}<div class="overlay-host">${overlay()}</div><div class="notice" role="status" aria-live="polite">${esc(s.notice)}</div>${dialogHTML()}`;
          positionOverlay();
          const dialog = app.querySelector('dialog');
          if (dialog) {
            dialog.addEventListener('cancel', () => {
              s.dialog = null;
              render();
            });
            dialog.showModal();
            dialog.querySelector('[data-action="cancel-dialog"]').focus();
          }
          autoLoad();
          if (afterRender) {
            const fn = afterRender;
            afterRender = null;
            fn();
          }
        }
        // Loading the next batch when Load more scrolls into view is an enhancement; the button stays.
        function autoLoad() {
          if (
            s.frozen ||
            s.selectMode ||
            !globalThis.IntersectionObserver ||
            !['articles', 'vocabulary'].includes(s.page)
          )
            return;
          const more = app.querySelector('[data-action="more"]');
          if (!more) return;
          observer = new IntersectionObserver(
            (entries) => {
              if (entries.some((e) => e.isIntersecting)) {
                observer.disconnect();
                loadNextBatch(false);
              }
            },
            { rootMargin: '0px 0px 80px 0px' },
          );
          observer.observe(more);
        }
        function notify(text) {
          s.notice = text;
          const el = app.querySelector('.notice');
          if (el) el.textContent = text;
          clearTimeout(noticeTimer);
          if (text && !s.frozen) noticeTimer = setTimeout(() => notify(''), 3500);
        }
        function focusVisible(selector) {
          const el = [...app.querySelectorAll(selector)].find(
            (x) => x.getBoundingClientRect().width > 0,
          );
          el?.focus({ preventScroll: true });
        }

        // ---------------------------------------------------------------- behaviour: lists
        function loadNextBatch(manual) {
          const vocab = s.page === 'vocabulary';
          const before = vocab ? s.vloaded : s.loaded;
          if (vocab) s.vloadingMore = true;
          else s.loadingMore = true;
          render();
          setTimeout(() => {
            if (vocab) {
              s.vloadingMore = false;
              s.vloaded += BATCH;
            } else {
              s.loadingMore = false;
              s.loaded += BATCH;
            }
            render();
            notify('More records loaded.');
            if (manual)

        function articleContext() {

        function openArticle(id, keepQueue = false) {

        // ---------------------------------------------------------------- behaviour: playback

        // ---------------------------------------------------------------- behaviour: lookups
        function explain(text) {
          const key = text.toLowerCase();

          const found =
            LOOKUPS[key] ||
            (card && {
              word: card.word,
              pos: card.pos,
              zh: card.zh,
              forms: card.forms,
              examples: [...card.examples],
            });
          return (
            found || {
              word: text,
              pos: 'phrase',
              zh: '所选词语在当前句子中的含义',
              forms: [key],
              examples: ALT_EXAMPLES.map((e) => e.replace('{w}', text)),
            }

        function openLookup(raw) {
          const text = raw.trim().replace(/^[\s.,;:!?“”"']+|[\s.,;:!?“”"']+$/g, '');

        function addWord() {

            zh: layer.zh,
            forms: layer.forms,
            examples: [...layer.examples],

        app.addEventListener('click', (e) => {
