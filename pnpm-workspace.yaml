# Install scripts stay off unless a package cannot work without one. esbuild, sharp,
# unrs-resolver and lefthook ship their native binaries as platform-specific optional
# dependencies, so their scripts are not needed. lefthook's script would also install the git
# hooks on every install, including inside the end-to-end test container; `task setup` installs
# them instead.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  lefthook: false
