          ) {
            s.layers.pop();
            render();
          }
        });

        // Vocabulary gestures: swipe left reveals Delete (80 px, stays open past 35 px); a 500 ms long press selects.
        function cancelGesture() {
          if (gesture?.hold) clearTimeout(gesture.hold);
          gesture = null;
        }
        app.addEventListener('pointerdown', (e) => {
          if (s.page !== 'vocabulary' || s.selectMode || !['touch', 'pen'].includes(e.pointerType))
            return;
          const card = e.target.closest('[data-vocab-card]');
          if (!card || e.target.closest('[data-delete-id],input,label')) return;
          cancelGesture();
          const id = Number(card.dataset.vocabCard);
          const g = {
            id,
            pointerId: e.pointerId,
            x: e.clientX,
            y: e.clientY,
            card,
            front: card.querySelector('.card-front'),
            direction: null,
            base: s.swipeId === id ? -80 : 0,
          };
          gesture = g;
          g.hold = setTimeout(() => {
            if (gesture !== g || g.direction) return;
            s.selectMode = true;
            s.selectedIds = [id];
            s.swipeId = null;
            s.suppressClickUntil = Date.now() + 600;
            cancelGesture();
            render();
            notify('1 word selected.');
            focusVisible(`[data-select-word="${id}"]`);
          }, 500);
        });
        app.addEventListener(
          'pointermove',
          (e) => {
            const g = gesture;
            if (!g || e.pointerId !== g.pointerId) return;
            const dx = e.clientX - g.x;
            const dy = e.clientY - g.y;
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
              clearTimeout(g.hold);
              if (!g.direction)
                g.direction = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'horizontal' : 'vertical';
            }
            if (g.direction === 'horizontal') {
              const x = Math.max(-80, Math.min(0, g.base + dx));
              g.front.style.transition = 'none';
              g.front.style.transform = `translateX(${x}px)`;
              g.card.setPointerCapture?.(e.pointerId);
              s.suppressClickUntil = Date.now() + 600;
            }
          },
          { passive: true },
        );
        app.addEventListener('pointerup', (e) => {
          const g = gesture;
          if (!g || e.pointerId !== g.pointerId) return;
          clearTimeout(g.hold);
          if (g.direction === 'horizontal') {
            s.swipeId = g.base + (e.clientX - g.x) < -35 ? g.id : null;
            s.suppressClickUntil = Date.now() + 400;
            cancelGesture();
            render();
          } else {
            if (g.direction === 'vertical') s.suppressClickUntil = Date.now() + 350;
            cancelGesture();
          }
        });
        app.addEventListener('pointercancel', () => {
          const g = gesture;
          if (g) s.suppressClickUntil = Date.now() + 350;
          cancelGesture();
          if (g?.direction === 'horizontal') render();
        });
        app.addEventListener('contextmenu', (e) => {
          if (e.target.closest('[data-vocab-card]')) e.preventDefault();
        });

        // Example carousels: a horizontal swipe of at least 45 px (and 1.3x the vertical move) turns the example.
        app.addEventListener('pointerdown', (e) => {
          if (!['touch', 'pen'].includes(e.pointerType) || e.target.closest('button,input,select'))
            return;
          const panel = e.target.closest('.example-carousel');
          if (panel)
            exampleGesture = {
              pointerId: e.pointerId,
              x: e.clientX,
              y: e.clientY,
              context: panel.dataset.exampleContext,
              layer: Number(panel.dataset.exampleLayer),
              moved: false,
            };
        });
        app.addEventListener(
          'pointermove',
          (e) => {
            const g = exampleGesture;
            if (
              g &&
              g.pointerId === e.pointerId &&
              (Math.abs(e.clientX - g.x) > 10 || Math.abs(e.clientY - g.y) > 10)
            )
              g.moved = true;
          },
          { passive: true },
        );
        app.addEventListener(
          'pointerup',
          (e) => {
            const g = exampleGesture;
            if (!g || g.pointerId !== e.pointerId) return;
            exampleGesture = null;
            if (!g.moved) return;
            suppressExampleLookupUntil = Date.now() + 400;
            const dx = e.clientX - g.x;
            const dy = e.clientY - g.y;
            if (
              Math.abs(dx) >= 45 &&
              Math.abs(dx) > Math.abs(dy) * 1.3 &&
              !getSelection()?.toString().trim()
            )
              moveExample(g.context, g.layer, dx < 0 ? 1 : -1);
          },
          true,
        );
        app.addEventListener('pointercancel', () => {
          exampleGesture = null;
          suppressExampleLookupUntil = Date.now() + 350;
        });
        window.addEventListener('resize', positionOverlay);

        // ---------------------------------------------------------------- screenshot states
        // Each state starts from fresh demo data, so a state never depends on the one before it.
        const reader =
          (extra = {}) =>
          (st) =>
            Object.assign(st, { page: 'reader', articleId: 1, returnArticles: null }, extra);
        const lookupLayer = (key, extra = {}) => ({
          ...LOOKUPS[key],
          kind: 'ready',
          idx: 0,
          audio: 'idle',
          saved: false,
          ...extra,
        });
        const vocabulary =
          (extra = {}) =>
          (st) =>
            Object.assign(st, { page: 'vocabulary' }, extra);
        const review =
          (mode, extra = {}) =>
          (st) => {
            st.page = 'review';
            st.review = Object.assign(nextQuestionFor(st, mode), extra);
          };
        function nextQuestionFor(st, mode) {
          const saved = s;
          s = st;
          const q = nextQuestion(mode);
          s = saved;
          return q;
        }
        function selectWords(row, from, to) {
          const spans = app.querySelectorAll(`[data-sentence-row="${row}"] [data-word]`);
          const range = document.createRange();
          range.setStartBefore(spans[from]);
          range.setEndAfter(spans[to]);
          getSelection().removeAllRanges();
          getSelection().addRange(range);
        }
        const fullQueue = () => ARTICLE_ROWS.map((r) => r[0]);
        const PRESETS = [
          [
            'sign-in',
            'Sign in',
            (st) => {
              st.auth = 'signedout';
            },
          ],
          [
            'not-a-member',
            'No access',
            (st) => {
              st.auth = 'notmember';
            },
          ],
          [
            'terms',
            'Terms of use',
            (st) => {
              st.termsAccepted = false;
            },
          ],
          [
            'license',
            'License',
            (st) => {
              st.termsAccepted = false;
              st.page = 'license';
              st.back = ['articles'];
            },
          ],
          ['articles', 'Articles', () => {}],
          [
            'articles-filter-source',
            'Articles: Source filter',
            (st) => {
              st.popover = 'source';
              st.draft = ['nasa-technology', 'nist-news'];
            },
          ],
          [
            'articles-filter-category',
            'Articles: Category filter',
            (st) => {
              st.sourceValues = ['nasa-technology', 'nist-news'];
              st.popover = 'category';
              st.draft = ['Technology'];
            },
          ],
          [
            'articles-sort',
            'Articles: sort',
            (st) => {
              st.popover = 'sort';
            },
          ],
          [
            'articles-search',
            'Articles: search results',
            (st) => {
              st.aq = 'satellite';
            },
          ],
          [
            'articles-search-empty',
            'Articles: no results',
            (st) => {
              st.aq = 'volcano';
            },
          ],
          [
            'articles-loading-more',
            'Articles: loading more',
            (st) => {
              st.loadingMore = true;
            },
          ],
          [
            'articles-empty',
            'Articles: empty',
            (st) => {
              st.articles = [];
            },
          ],
          ['reader', 'Reader', reader()],
          [
            'reader-playing',
            'Reader: playing',
            reader({ playing: true, playMode: 'article', position: true, sentence: 2 }),
          ],
          [
            'reader-sentence-selected',
            'Reader: sentence selected',
            reader({ single: 4, sentence: 4 }),
          ],
          [
            'reader-speed',
            'Reader: speed',
            reader({ popover: 'speed', position: true, sentence: 2, speed: 1.25 }),
          ],
          [
            'reader-continuous',
            'Reader: continuous play',
            reader({
              playing: true,
              playMode: 'article',
              position: true,
              sentence: 5,
              queue: fullQueue(),
              queueIndex: 0,
            }),
          ],
          ['reader-attribution', 'Reader: attribution', reader({ articleId: 5 })],
          [
            'reader-tap-to-continue',
            'Reader: Tap to continue',
            reader({
              articleId: 2,
              blocked: true,
              position: true,
              sentence: 0,
              queue: fullQueue(),
              queueIndex: 1,
            }),
          ],
          ['reader-close-x', 'Reader: close button variant', reader({ readerClose: 'x' })],
          [
            'lookup-loading',
            'Explanation: loading',
            reader({
              layers: [{ kind: 'loading', text: 'resilient', idx: 0, audio: 'idle', saved: false }],
            }),
          ],
          ['lookup', 'Explanation', reader({ layers: [lookupLayer('resilient')] })],
          [
            'lookup-example-2',
            'Explanation: example 2 of 2',
            reader({ layers: [lookupLayer('resilient', { idx: 1 })] }),
          ],
          [
            'lookup-word-audio-generating',
            'Explanation: word audio generating',
            reader({ layers: [lookupLayer('resilient', { audio: 'generating' })] }),
          ],
          [
            'lookup-audio-unavailable',
            'Explanation: audio unavailable',
            reader({ layers: [lookupLayer('resilient', { audio: 'error' })] }),
          ],
          [
            'lookup-failed',
            'Explanation: AI failed',
            reader({
              layers: [{ kind: 'error', text: 'resilient', idx: 0, audio: 'idle', saved: false }],
            }),
          ],
          [
            'lookup-too-long',
            'Selection too long',
            reader({ notice: 'Select up to 8 words.' }),
            () => selectWords(7, 0, 9),
          ],
          [
            'lookup-nested',
            'Nested explanation',
            reader({ layers: [lookupLayer('resilient'), lookupLayer('coating')] }),
          ],
          [
            'save-saved',
            'Saved to Vocabulary',
            (st) => {
              reader({
                layers: [lookupLayer('adapt', { saved: true })],
                notice: 'Saved to Vocabulary.',
              })(st);
              st.words.push({
                id: 10,
                word: 'adapt',
                pos: 'verb',
                zh: LOOKUPS.adapt.zh,
                forms: LOOKUPS.adapt.forms,
                examples: [...LOOKUPS.adapt.examples],
                options: [],
                correct: 0,
                m: NEW(),
              });
            },
          ],
          [
            'save-replace',
            'Replace saved word',
            reader({ layers: [lookupLayer('resilient')], dialog: { kind: 'replace', layer: 0 } }),
          ],
          ['vocabulary', 'Vocabulary: All and review modes', vocabulary()],
          ['vocabulary-new', 'Vocabulary: New', vocabulary({ tab: 'New' })],
          ['vocabulary-ongoing', 'Vocabulary: Ongoing', vocabulary({ tab: 'Ongoing' })],
          ['vocabulary-archived', 'Vocabulary: Archived', vocabulary({ tab: 'Archived' })],
          ['vocabulary-search', 'Vocabulary: search', vocabulary({ vq: 'adjective' })],
          [
            'vocabulary-swipe-half',
            'Swipe to delete: half open',
            vocabulary({ swipeDrag: { id: 2, x: -40 } }),
          ],
          ['vocabulary-swipe-open', 'Swipe to delete: open', vocabulary({ swipeId: 2 })],
          [
            'vocabulary-delete-one',
            'Delete one word',
            vocabulary({ swipeId: 2, dialog: { kind: 'delete', ids: [2] } }),
          ],
          [
            'vocabulary-long-press',
            'Long press: select mode entered',
            vocabulary({ selectMode: true, selectedIds: [9], notice: '1 word selected.' }),
          ],
          [
            'vocabulary-multi-select',
            'Multi-select',
            vocabulary({ selectMode: true, selectedIds: [2, 6, 4] }),
          ],
          [
            'vocabulary-batch-delete',
            'Batch delete',
            vocabulary({
              selectMode: true,
              selectedIds: [2, 6, 4],
              dialog: { kind: 'delete', ids: [2, 6, 4] },
            }),
          ],
          ['vocabulary-empty', 'Vocabulary: empty', vocabulary({ words: [] })],
          ['card-detail', 'Word card', (st) => Object.assign(st, { page: 'detail', detailId: 1 })],
          ['review-spell', 'Spell: dictation prompt', review('Spell')],
          [
            'review-spell-correct',
            'Spell: correct',
            review('Spell', {
              answer: 'resilient',
              feedback: 'correct',
              result: 'Correct · Next review in 4 days',
            }),
          ],
          [
            'review-spell-wrong',
            'Spell: wrong',
            review('Spell', { answer: 'resiliant', feedback: 'incorrect' }),
          ],
          ['review-translate', 'Translate: prompt', review('Translate')],
          [
            'review-translate-answered',
            'Translate: answered',
            review('Translate', {
              option: 1,
              feedback: 'correct',
              result: 'Correct · Next review in 4 days',
            }),
          ],
          [
            'review-empty',
            'Review: nothing due',
            (st) => {
              st.words.forEach((w) => {
                const x = w.m[1];
                if (isNew(x) || isDue(x))
                  Object.assign(x, { round: Math.max(1, x.round), mins: 180 + w.id * 60 });
              });
              review('Spell')(st);
            },
          ],
          [
            'review-offline',
            'Review: not saved',
            review('Spell', { answer: 'resilient', feedback: 'offline' }),
          ],
          [
            'review-changed',
            'Review: changed on another device',
            review('Spell', { answer: 'resilient', feedback: 'changed' }),
          ],
          [
            'account-menu',
            'Account menu',
            (st) => {
              st.accountOpen = true;
            },
          ],
        ].map(([name, title, apply, after]) => ({ name, title, apply, after }));

        function show(name) {
          const preset = PRESETS.find((x) => x.name === name);
          if (!preset) return false;
          clearTimeout(timer);
          clearTimeout(noticeTimer);
          getSelection()?.removeAllRanges();
          s = freshState();
          s.frozen = true;
          preset.apply(s);
          afterRender = preset.after || null;
          document.documentElement.dataset.static = '';
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
          document.documentElement.dataset.state = name;
          return true;
        }
        window.vexto = {
          presets: PRESETS.map(({ name, title }) => ({ name, title })),
          show,
          relayout: positionOverlay,
        };

        s = freshState();
        const initial = decodeURIComponent(location.hash.slice(1));
        if (!initial || !show(initial)) render();
        window.addEventListener('hashchange', () =>
          show(decodeURIComponent(location.hash.slice(1))),
        );
      })();
    </script>
  </body>
</html>
