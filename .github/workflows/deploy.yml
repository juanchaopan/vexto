# Manual deployment of a version to a target. Production takes a version tag such as v1.2.3;
# staging also takes a commit SHA. The commit must be on main and its ci run on main must have
# passed every check before deploy-target runs. Production fails until its GitHub environment
# is set up (see deploy-target.yml).
#
# The reusable workflow is referenced as ./...: actionlint cannot parse GitHub's
# self-repository form $/... yet, so zizmor's self-repository finding is ignored on that line.
# It gets the secrets with `secrets: inherit`, because the secrets of the target's GitHub
# environment reach a reusable workflow only when the caller passes them, and inheriting keeps
# the runtime names in scripts/lib/runtime-env.ts only; zizmor's secrets-inherit finding is
# ignored on that line too (see deploy-target.yml).
name: deploy
run-name: deploy ${{ inputs.version }} to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Version tag such as v1.2.3, or for staging a commit SHA on main
        type: string
        required: true

permissions: {}

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # reads the ci runs and jobs of the commit
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the version to a commit on main that passed ci
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            ref="refs/tags/$VERSION"
          elif [ "$TARGET" = staging ] && [[ "$VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then
            ref="$VERSION"
          elif [ "$TARGET" = production ]; then
            fail "Production deploys a version tag such as v1.2.3."
          else
            fail "Staging deploys a version tag such as v1.2.3 or a commit SHA on main."
          fi

          sha=$(git rev-parse --verify --quiet "$ref^{commit}") \
            || fail "$VERSION is not a commit of this repository."
          git merge-base --is-ancestor "$sha" origin/main || fail "$VERSION ($sha) is not on main."

          # The latest ci run of the push to main that brought in the commit must have passed
          # every job except the staging deployment it started.
          runs_url="repos/$REPO/actions/workflows/ci.yml/runs"
          run_id=$(gh api "$runs_url?head_sha=$sha&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          [ -n "$run_id" ] || fail "No ci run on main exists for $sha."
          not_passed=$(gh api --paginate "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | select((.name | startswith("deploy-staging")) | not)
              | select(.conclusion != "success" and .conclusion != "skipped")
              | "\(.name): \(.conclusion // .status)"')
          if [ -n "$not_passed" ]; then
            echo "$not_passed"
            fail "ci has not passed for $sha (run $run_id)."
          fi

          echo "Deploying $VERSION ($sha) to $TARGET."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-target.yml # zizmor: ignore[self-repository,secrets-inherit]
    with:
      target: ${{ inputs.target }}
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
